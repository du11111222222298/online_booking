<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>انتخاب زمان نوبت</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-3 text-center">زمان‌های خالی برای: {{ service.name }}</h1>
        <p class="text-center text-muted mb-4">مدت خدمت: {{ service.duration_minutes }} دقیقه</p>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <ul class="list-group shadow-sm">
                    {% for slot in slots %}
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <span>{{ slot.start_time }} تا {{ slot.end_time }}</span>
                            <a href="{% url 'book_slot' slot.id %}" class="btn btn-success btn-sm">رزرو این نوبت</a>
                        </li>
                    {% empty %}
                        <li class="list-group-item text-center text-muted py-4">در حال حاضر زمان خالی برای این خدمت وجود ندارد.</li>
                    {% endfor %}
                </ul>
                <div class="text-center mt-4">
                    <a href="{% url 'service_list' %}" class="btn btn-secondary">بازگشت به لیست خدمات</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
